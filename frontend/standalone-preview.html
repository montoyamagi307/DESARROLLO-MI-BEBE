              </div>
            </div>

            <div style={{ display: 'flex', alignItems: 'center', gap: '1rem' }}>
              <div style={{ background: '#F3F5F4', padding: '6px 14px', borderRadius: '9999px', fontSize: '0.85rem' }}>
                👶 <strong>{child.first_name} {child.last_name}</strong> • Sendero de Crecimiento
              </div>
              <button className="btn btn-secondary" onClick={() => setPreviewOpen(true)}>
                📖 Previsualizar Libro Evolutivo
              </button>
            </div>
          </header>

          <div className="main-container">
            {/* Banner Conceptual del Proceso Evolutivo */}
            <div className="evolution-hero">
              <div>
                <span style={{ background: 'rgba(255,255,255,0.2)', padding: '4px 12px', borderRadius: '9999px', fontSize: '0.75rem', fontWeight: 700, letterSpacing: '1px' }}>
                  FILOSOFÍA DEL DESARROLLO SIN CALENDARIOS RÍGIDOS
                </span>
                <h1 className="hero-title">El Crecimiento como un Viaje Continuo</h1>
                <p className="hero-desc">
                  El desarrollo de {child.first_name} no ocurre por casillas mensuales de calendario; ocurre como un
                  <strong> río evolutivo de conquistas</strong>. Cada hito surge a su propio ritmo. Documenta los momentos
                  cuando florecen de forma natural y observa cómo se entrelazan en su libro de vida.
                </p>
              </div>

              <div style={{ background: 'rgba(255,255,255,0.12)', backdropFilter: 'blur(8px)', padding: '1.25rem 1.75rem', borderRadius: '16px', textAlign: 'center', minWidth: '180px' }}>
                <span style={{ fontSize: '0.8rem', opacity: 0.85 }}>Conquistas Registradas</span>
                <div style={{ fontSize: '2.4rem', fontFamily: 'var(--font-serif)', fontWeight: 700, margin: '4px 0' }}>
                  {completedCount} / {totalCount}
                </div>
                <span style={{ fontSize: '0.75rem', color: '#E3B505', fontWeight: 600 }}>
                  {pathwayPercent}% de este Sendero
                </span>
              </div>
            </div>

            {/* Selector de los 4 Grandes Senderos Evolutivos */}
            <div className="pathway-selector">
              {EVOLUTIONARY_PATHWAYS.map(p => {
                const isSelected = p.id === selectedPathwayId;
                const comp = p.milestones.filter(m => m.status === 'completed').length;

                return (
                  <div
                    key={p.id}
                    className={`pathway-card ${isSelected ? 'active' : ''}`}
                    onClick={() => setSelectedPathwayId(p.id)}
                  >
                    <div className="pathway-icon">{p.icon}</div>
                    <div>
                      <div className="pathway-name">{p.name}</div>
                      <div className="pathway-count">{comp} de {p.milestones.length} hitos registrados</div>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Ruta Evolutiva del Sendero Activo */}
            <div className="evolutionary-road">
              <div className="road-header">
                <div>
                  <span style={{ color: 'var(--color-secondary)', fontSize: '0.8rem', fontWeight: 700, letterSpacing: '1px' }}>
                    TRAYECTORIA CONTINUA
                  </span>
                  <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.8rem', color: 'var(--color-primary)', marginTop: '4px' }}>
                    {activePathway.icon} {activePathway.name}
                  </h2>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.95rem' }}>{activePathway.subtitle}</p>
                </div>

                <div style={{ display: 'flex', gap: '8px' }}>
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '0.8rem', color: 'var(--color-success)', fontWeight: 600 }}>
                    <span style={{ width: '10px', height: '10px', borderRadius: '50%', background: 'var(--color-success)' }} /> Conquistado
                  </span>
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '0.8rem', color: 'var(--color-secondary)', fontWeight: 600, marginLeft: '12px' }}>
                    <span style={{ width: '10px', height: '10px', borderRadius: '50%', background: 'var(--color-secondary)' }} /> En Observación Actual
                  </span>
                </div>
              </div>

              {/* Cadena de Hitos con Stepper Conector */}
              <div className="milestone-chain">
                {activePathway.milestones.map((m, idx) => {
                  return (
                    <div key={m.id} className={`milestone-node ${m.status}`}>
                      <div className="node-indicator">
                        {m.status === 'completed' ? '✓' : (idx + 1)}
                      </div>

                      <div className="node-card">
                        <div className="node-top">
                          <div>
                            <h3 className="node-title">{m.title}</h3>
                            <span className="node-science">📚 {m.science}</span>
                          </div>
                          <span className="node-window-tag">Ventana orientativa: {m.window}</span>
                        </div>

                        <p className="node-desc">{m.desc}</p>

                        {/* Registro guardado por la familia */}
                        {m.record ? (
                          <div className="parent-record-box">
                            <div className="record-header">
                              <span>📅 FECHA VIVIDA: {m.record.date}</span>
                              <span style={{ cursor: 'pointer', textDecoration: 'underline' }} onClick={() => setActiveModalMilestone(m)}>
                                ✏️ Editar Recuerdo
                              </span>
                            </div>
                            <p className="record-text">"{m.record.text}"</p>
                          </div>
                        ) : (
                          <div style={{ marginTop: '0.75rem' }}>
                            <button
                              className="btn btn-outline"
                              style={{ fontSize: '0.8rem', padding: '6px 14px' }}
                              onClick={() => setActiveModalMilestone(m)}
                            >
                              ✍️ Registrar este Hito cuando ocurra
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* Modal para Registrar/Editar Hito Evolutivo */}
          {activeModalMilestone && (
            <div className="modal-backdrop" onClick={() => setActiveModalMilestone(null)}>
              <div className="modal-box" style={{ maxWidth: '600px' }} onClick={e => e.stopPropagation()}>
                <h3 style={{ fontFamily: 'var(--font-serif)', color: 'var(--color-primary)', fontSize: '1.4rem', marginBottom: '0.25rem' }}>
                  Registrar Hito Evolutivo
                </h3>
                <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem', marginBottom: '1.5rem' }}>
                  {activeModalMilestone.title} ({activeModalMilestone.window})
                </p>

                <div style={{ marginBottom: '1rem' }}>
                  <label style={{ fontSize: '0.82rem', fontWeight: 600, display: 'block', marginBottom: '4px' }}>
                    Fecha exacta o aproximada:
                  </label>
                  <input
                    type="date"
                    style={{ width: '100%', padding: '10px', borderRadius: '8px', border: '1px solid #CBD5E1' }}
                    defaultValue={activeModalMilestone.record?.date !== 'Hoy (En proceso)' ? activeModalMilestone.record?.date : '2026-07-20'}
                  />
                </div>

                <div style={{ marginBottom: '1.5rem' }}>
                  <label style={{ fontSize: '0.82rem', fontWeight: 600, display: 'block', marginBottom: '4px' }}>
                    ¿Cómo fue este momento? Tus observaciones y anécdota familiar:
                  </label>
                  <textarea
                    style={{ width: '100%', minHeight: '120px', padding: '12px', borderRadius: '8px', border: '1px solid #CBD5E1', fontFamily: 'inherit', fontSize: '0.92rem' }}
                    placeholder="Cuenta qué hizo, qué sintieron ustedes y qué detalles divertidos o conmovedores ocurrieron..."
                    defaultValue={activeModalMilestone.record?.text || ''}
                  />
                </div>

                <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '8px' }}>
                  <button className="btn btn-outline" onClick={() => setActiveModalMilestone(null)}>
                    Cancelar
                  </button>
                  <button
                    className="btn btn-primary"
                    onClick={() => {
                      alert('✓ Hito evolutivo guardado en la memoria de vida de ' + child.first_name);
                      setActiveModalMilestone(null);
                    }}
                  >
                    Guardar en el Libro
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Modal Previsualizador del Libro en Formato de Crónica Evolutiva */}
          {previewOpen && (
            <div className="modal-backdrop" onClick={() => setPreviewOpen(false)}>
              <div className="modal-box" onClick={e => e.stopPropagation()}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1.5rem', borderBottom: '1px solid #E7ECE9', paddingBottom: '1rem' }}>
                  <div>
                    <h2 style={{ fontFamily: 'var(--font-serif)', color: 'var(--color-primary)' }}>
                      📖 El Libro como Crónica Evolutiva de Vida
                    </h2>
                    <p style={{ color: 'var(--text-muted)', fontSize: '0.85rem' }}>
                      Las respuestas no se muestran como preguntas sueltas, sino como una biografía continua y elegante.
                    </p>
                  </div>
                  <button className="btn btn-outline" onClick={() => setPreviewOpen(false)}>✕ Cerrar</button>
                </div>

                {/* Hoja 1: Portadilla Evolutiva */}
                <div className="sheet" style={{ textAlign: 'center', padding: '3.5rem 2rem' }}>
                  <span style={{ fontSize: '0.8rem', letterSpacing: '3px', color: 'var(--color-secondary)', fontWeight: 700 }}>
                    CAPÍTULO I • TRAYECTORIA DEL MOVIMIENTO
                  </span>
                  <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: '2.4rem', color: 'var(--color-primary)', margin: '0.5rem 0' }}>
                    La Conquista de tu Propio Cuerpo
                  </h1>
                  <p style={{ fontStyle: 'italic', color: '#5C6E67', marginBottom: '2.5rem' }}>
                    De los brazos acogedores a la libertad de explorar el mundo
                  </p>

                  <div style={{ background: '#FAF9F6', padding: '1.25rem', borderRadius: '8px', maxWidth: '500px', margin: '0 auto 2.5rem' }}>
                    <p style={{ fontStyle: 'italic', fontFamily: 'var(--font-serif)', color: '#1C2723', lineHeight: 1.6 }}>
                      "Cada movimiento tuyo no fue solo un músculo que despertó, sino un acto de valentía con el que decidiste conocer la vida."
                    </p>
                  </div>

                  <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.8rem', color: 'var(--color-primary)' }}>
                    {child.first_name} {child.last_name}
                  </h2>
                </div>

                {/* Hoja 2: Crónica Literaria Fluida */}
                <div className="sheet">
                  <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '1.5rem', color: 'var(--color-primary)', marginBottom: '1.25rem' }}>
                    Cuando tus Manos Descubrieron el Mundo
                  </h3>

                  <p style={{ fontSize: '0.98rem', lineHeight: 1.8, color: '#2D3748', marginBottom: '1.5rem' }}>
                    Durante tus primeras semanas en casa, tu cuerpo buscaba instintivamente la flexión segura que tenías dentro del vientre. 
                    Mantenías tus manitas cerradas cerca del pecho, y cualquier sobresalto despertaba ese reflejo simétrico de abrazo que nos hacía 
                    acercarte más a nuestro regazo.
                  </p>

                  <p style={{ fontSize: '0.98rem', lineHeight: 1.8, color: '#2D3748', marginBottom: '1.5rem' }}>
                    Hacia los tres meses, ocurrió algo inolvidable: tus dedos se abrieron lentamente. Te quedabas quieta mirándolos, como si 
                    fueran pequeños seres mágicos. Fue el <strong>4 de junio de 2026</strong> cuando extendiste tus dos brazos a la vez para sujetar 
                    aquel sonajero verde, conquistando tu primera prensión voluntaria.
                  </p>

                  <div style={{ background: '#F8FAF9', borderLeft: '3px solid var(--color-secondary)', padding: '1rem 1.25rem', margin: '1.5rem 0' }}>
                    <p style={{ fontStyle: 'italic', fontFamily: 'var(--font-serif)', color: '#243E36', fontSize: '1.05rem', lineHeight: 1.6 }}>
                      "Te dejamos un día boca arriba en la alfombra y, cuando pestañeamos, habías rodado completamente sobre tu estómago. 
                      Nos miraste desde el suelo con una risa victoriosa que llenó toda la sala."
                    </p>
                  </div>

                  <p style={{ fontSize: '0.98rem', lineHeight: 1.8, color: '#2D3748' }}>
                    Hoy estás aprendiendo a sentarte erguida por ti misma. La postura de tu espalda ya sostiene tu curiosidad, y sabemos que 
                    muy pronto el gateo y tus primeros pasos te llevarán tan lejos como tus sueños te lo pidan.
                  </p>
                </div>

                <div style={{ textAlign: 'center', marginTop: '1.5rem' }}>
                  <button className="btn btn-secondary" onClick={() => alert('¡El PDF con formato de Crónica Evolutiva está listo para compilarse en Node.js!')}>
                    📥 Descargar Libro como Crónica Evolutiva en PDF
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
